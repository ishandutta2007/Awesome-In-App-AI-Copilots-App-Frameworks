<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <style>
      .glow-orb-1 {
        animation: floatOrb1 10s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 12s ease-in-out infinite alternate;
      }
      .glow-orb-3 {
        animation: floatOrb3 8s ease-in-out infinite alternate;
      }
      .pulse-pill {
        animation: floatPill 6s ease-in-out infinite alternate;
      }
      .pulse-pill-delay {
        animation: floatPill 6s ease-in-out infinite alternate;
        animation-delay: -3s;
      }
      .stream-particle {
        animation: streamFlow 5s linear infinite;
      }
      .stream-particle-2 {
        animation: streamFlow 7s linear infinite;
        animation-delay: -2.5s;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
        100% { transform: translate(60px, 40px) scale(1.2); opacity: 0.8; }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0, 0) scale(1.1); opacity: 0.4; }
        100% { transform: translate(-50px, -30px) scale(0.9); opacity: 0.7; }
      }
      @keyframes floatOrb3 {
        0% { transform: translate(0, 0); opacity: 0.3; }
        100% { transform: translate(40px, -50px); opacity: 0.6; }
      }
      @keyframes floatPill {
        0% { transform: translateY(0); }
        100% { transform: translateY(-8px); }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .banner-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .banner-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 18px;
        font-weight: 400;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid -->
  <rect width="1200" height="360" rx="16" fill="url(#gridPattern)" />

  <!-- Animated Ambient Glowing Orbs in Background -->
  <g filter="url(#glow)">
    <circle class="glow-orb-1" cx="200" cy="100" r="140" fill="#3b82f6" opacity="0.3" />
    <circle class="glow-orb-2" cx="1020" cy="220" r="160" fill="#8b5cf6" opacity="0.35" />
    <circle class="glow-orb-3" cx="600" cy="320" r="120" fill="#06b6d4" opacity="0.25" />
  </g>

  <!-- Subtle Dynamic Wave Curves in Lower Background -->
  <path d="M 0 280 Q 300 240, 600 290 T 1200 270 L 1200 360 L 0 360 Z" fill="#0f172a" fill-opacity="0.4" />
  <path d="M 0 310 Q 350 260, 700 320 T 1200 300" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="12 8" class="stream-particle" />
  <path d="M 0 250 Q 400 320, 800 250 T 1200 290" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="16 10" class="stream-particle-2" />

  <!-- Floating Dynamic Feature Pills (Left & Right Flanks) -->
  <g class="pulse-pill" transform="translate(60, 50)" filter="url(#cardShadow)">
    <rect width="210" height="42" rx="21" fill="url(#pillGrad1)" stroke="url(#pillBorder)" stroke-width="1.5" />
    <circle cx="24" cy="21" r="7" fill="#10b981" />
    <text x="42" y="26" class="pill-text" fill="#e2e8f0">Generative UI / AG-UI</text>
  </g>

  <g class="pulse-pill-delay" transform="translate(70, 260)" filter="url(#cardShadow)">
    <rect width="200" height="42" rx="21" fill="url(#pillGrad1)" stroke="url(#pillBorder)" stroke-width="1.5" />
    <circle cx="24" cy="21" r="7" fill="#f59e0b" />
    <text x="42" y="26" class="pill-text" fill="#e2e8f0">Autonomous Agents</text>
  </g>

  <g class="pulse-pill" transform="translate(930, 60)" filter="url(#cardShadow)">
    <rect width="205" height="42" rx="21" fill="url(#pillGrad1)" stroke="url(#pillBorder)" stroke-width="1.5" />
    <circle cx="24" cy="21" r="7" fill="#06b6d4" />
    <text x="42" y="26" class="pill-text" fill="#e2e8f0">In-App Copilot SDKs</text>
  </g>

  <g class="pulse-pill-delay" transform="translate(920, 250)" filter="url(#cardShadow)">
    <rect width="220" height="42" rx="21" fill="url(#pillGrad1)" stroke="url(#pillBorder)" stroke-width="1.5" />
    <circle cx="24" cy="21" r="7" fill="#8b5cf6" />
    <text x="42" y="26" class="pill-text" fill="#e2e8f0">Stateful RAG Workflows</text>
  </g>

  <!-- Foreground Content Container (Ensures 100% Legibility & Clear Focal Center) -->
  <g transform="translate(600, 125)" text-anchor="middle">
    <!-- Center Tag Badge -->
    <rect x="-160" y="-36" width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="-15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="35" class="banner-title" fill="url(#accentCyan)">Awesome In-App AI Copilots</text>
    <text x="0" y="75" class="banner-title" fill="#ffffff">&amp; Agentic App Frameworks</text>

    <!-- Subtitle -->
    <text x="0" y="120" class="banner-subtitle">
      Embeddable AI Copilots • Generative UI Components • Visual Workflows • Multi-Agent Runtimes
    </text>
  </g>

  <!-- Corner Border Accent -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />
</svg>
